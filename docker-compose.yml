services:
  stockflow.api:
    image: ${DOCKER_REGISTRY-}stockflowapi
    build:
      context: .
      dockerfile: StockFlow.API/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__SqlConnection=Server=sqlserver;Database=StockFlowDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SA_PASSWORD}", "-C", "-b", "-Q", "IF DB_ID('StockFlowDb') IS NOT NULL EXEC('SELECT TOP (1) 1 FROM [StockFlowDb].sys.tables');"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data: